[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federal-api-watch"
version = "0.1.0"
description = "Uptime and changelog tracker for U.S. federal government APIs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "stark256-spec" }]
keywords = [
  "government",
  "api-monitoring",
  "uptime",
  "status-page",
  "civic-tech",
  "open-data",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
federal-api-watch = "federal_api_watch.cli:main"

[project.urls]
Homepage = "https://github.com/stark256-spec/federal-api-watch"

[tool.hatch.build.targets.wheel]
packages = ["src/federal_api_watch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
